name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ESPRemoteControl/**"
      - "Shared/**"
      - "ESPRemoteControl.xcodeproj/**"
      - "Tests/**"
      - "scripts/**"
      - ".github/workflows/build-ios-ipa.yml"
  push:
    branches:
      - main
      - codex/v2-direct-ble-hid
    tags:
      - "ios-v*"
    paths:
      - "ESPRemoteControl/**"
      - "ESPRemoteControlShare/**"
      - "Shared/**"
      - "ESPRemoteControl.xcodeproj/**"
      - "Tests/**"
      - "scripts/test-direct-hid.sh"
      - "scripts/test-press-actions.sh"
      - "scripts/build-unsigned-ipa.sh"
      - "scripts/update-sidestore-source.py"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test HID reports and session routing
        run: ./scripts/test-direct-hid.sh

      - name: Install ldid
        run: brew install ldid

      - name: Install UI test project generator
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: brew install xcodegen

      - name: Test short and long button presses on iPhone Simulator
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: ./scripts/test-press-actions.sh

      - name: Upload failed button UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: press-actions-test-results
          path: |
            dist/press-actions.xcresult
            dist/press-actions-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build unsigned IPA
        run: ./scripts/build-unsigned-ipa.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ESPRemoteControl-unsigned
          path: |
            dist/ESPRemoteControl-unsigned.ipa
            dist/ESPRemoteControl-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ESPRemoteControl-unsigned.ipa dist/ESPRemoteControl-unsigned.ipa.sha256 --generate-notes

      - name: Publish update to SideStore source
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          version="${GITHUB_REF_NAME#ios-v}"
          ipa_size="$(stat -f '%z' dist/ESPRemoteControl-unsigned.ipa)"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ESPRemoteControl-unsigned.ipa"

          git switch --force-create sidestore-source-update origin/main
          python3 scripts/update-sidestore-source.py \
            --source sidestore-source.json \
            --version "$version" \
            --date "$(date -u +%F)" \
            --download-url "$download_url" \
            --size "$ipa_size" \
            --description "ESP Remote Control ${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore-source.json
          git commit -m "Update SideStore source for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
