name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "ios-v*"
    paths:
      - "ESPRemoteControl/**"
      - "ESPRemoteControl.xcodeproj/**"
      - "scripts/build-unsigned-ipa.sh"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: ./scripts/build-unsigned-ipa.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ESPRemoteControl-unsigned
          path: |
            dist/ESPRemoteControl-unsigned.ipa
            dist/ESPRemoteControl-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ESPRemoteControl-unsigned.ipa dist/ESPRemoteControl-unsigned.ipa.sha256 --generate-notes
