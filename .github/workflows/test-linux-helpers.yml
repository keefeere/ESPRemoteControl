name: Test Linux helpers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/linux-*"
      - "Tests/test_linux_*.py"
      - ".github/workflows/test-linux-helpers.yml"
  push:
    paths:
      - "scripts/linux-*"
      - "Tests/test_linux_*.py"
      - ".github/workflows/test-linux-helpers.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check shell syntax
        run: bash -n scripts/linux-hid-connect.sh scripts/linux-le-api-test.sh

      - name: Run offline helper tests
        run: python3 -B -m unittest discover -s Tests -p 'test_linux_*.py' -v
