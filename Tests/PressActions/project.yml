name: PressActionsTests
options:
  bundleIdPrefix: com.keefeere.ESPRemoteControl.tests
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PressActionsHost:
    type: application
    platform: iOS
    sources:
      - TestApp.swift
      - ShortAndLongPressButtonStyle.swift
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  PressActionsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PressActionsUITests.swift
    dependencies:
      - target: PressActionsHost
    settings:
      base:
        TEST_TARGET_NAME: PressActionsHost
schemes:
  PressActionsHost:
    build:
      targets:
        PressActionsHost: all
        PressActionsUITests: [test]
    test:
      targets:
        - PressActionsUITests
